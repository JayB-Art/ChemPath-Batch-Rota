<!doctype html>
<html data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bench Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
/* Layout: one working column. The header carries period navigation and four tabs (Schedule, Hours, Setup, Team).
   Schedule is a day-by-day ledger; each shift bar sits on a 24-hour lab day that starts at 08:30. */
:root{
  --bg:#EDF1EF; --surface:#FAFCFB; --ink:#13201E; --ink-2:#506360;
  --line:#D2DBD8; --line-2:#E3EAE7;
  --accent:#B8105C; --on-accent:#FFFFFF; --accent-soft:#F6DCE8;
  --day:#4E9E92; --night:#233F52;
  --ok:#1B7A4E; --warn:#B3261E; --warn-soft:#F8DEDB;
  --wl:42%;
  --font-ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1715; --surface:#16211F; --ink:#E5EEEB; --ink-2:#9BAFAA;
    --line:#2B3C39; --line-2:#22312E;
    --accent:#FF74AE; --on-accent:#2A0A1A; --accent-soft:#3A1828;
    --day:#5BB5A8; --night:#7FA6C2;
    --ok:#5ED59C; --warn:#FF8A80; --warn-soft:#3A1E1C;
    --wl:64%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1715; --surface:#16211F; --ink:#E5EEEB; --ink-2:#9BAFAA;
  --line:#2B3C39; --line-2:#22312E;
  --accent:#FF74AE; --on-accent:#2A0A1A; --accent-soft:#3A1828;
  --day:#5BB5A8; --night:#7FA6C2;
  --ok:#5ED59C; --warn:#FF8A80; --warn-soft:#3A1E1C;
  --wl:64%; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.45;
  padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1000px;margin:0 auto}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.brandline{display:flex;flex-wrap:wrap;gap:.25rem .9rem;align-items:baseline;justify-content:space-between;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.brandline b{color:var(--ink);font-weight:500}
.store{letter-spacing:.04em;text-transform:none}
.pnav{display:flex;align-items:center;gap:.6rem;margin-top:.9rem}
.plabel{min-width:0;flex:1}
.plabel h1{font-size:clamp(1.45rem,1rem + 2.6vw,2.3rem);font-weight:700;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums}
.pmeta{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;margin-top:.35rem;color:var(--ink-2);font-size:.85rem}
.iconbtn{flex:none;width:2.6rem;height:2.6rem;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.iconbtn:hover{border-color:var(--ink-2)}
.iconbtn svg{width:1.1rem;height:1.1rem}
.status{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:600;padding:.12rem .55rem;border-radius:99px;background:var(--line-2);color:var(--ink)}
.status::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--ink-2)}
.status.built::before{background:var(--ok)}
.status.todo::before{background:var(--accent)}
.tabs{display:flex;gap:.1rem;margin-top:1.1rem;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:.65rem .95rem;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:1.25rem}

/* shared controls */
.btn{padding:.55rem .95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:.35rem .65rem;font-size:.82rem}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:.2rem 0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label,.lbl{font-size:.78rem;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
input[type=text],input[type=date],input[type=password],select{font:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--accent);flex:none;margin:0}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.grow{flex:1}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:.08rem .5rem;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.dot{display:inline-block;width:.62rem;height:.62rem;border-radius:50%;flex:none;background:hsl(var(--wh,200) 58% var(--wl))}
.muted{color:var(--ink-2)}
.note{color:var(--ink-2);font-size:.88rem;max-width:62ch}

/* toolbar + notices */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.notice h3{font-size:.95rem;margin-bottom:.35rem}
.notice ul{margin:.3rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.15rem}
.notice li button{background:none;border:0;padding:.1rem 0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;font-size:.8rem;color:var(--ink-2);margin-bottom:.4rem}
.legend .sw{display:inline-block;width:1.3rem;height:.6rem;border-radius:3px;vertical-align:middle;margin-right:.35rem}

/* schedule ledger */
.wk{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:1.4rem 0 .35rem}
.day{display:grid;grid-template-columns:4.8rem minmax(0,1fr);gap:.4rem .6rem;padding:.65rem .5rem;border-top:1px solid var(--line)}
.day.weekend,.day.holiday{background:var(--surface);border-radius:10px;border:1px solid var(--line);margin:.2rem 0}
.dnum{display:flex;flex-direction:column;line-height:1.1}
.dw{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.dd{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dm{font-size:.78rem;color:var(--ink-2)}
.dtag{grid-column:2;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.78rem;color:var(--ink-2);min-height:1.2rem}
.shifts{grid-column:2;display:flex;flex-direction:column;gap:.1rem}
.day > .dnum{grid-row:1 / span 2}
.shift{display:grid;grid-template-columns:11rem 2.2rem minmax(4rem,1fr) minmax(7.5rem,13rem);gap:.6rem;align-items:center;text-align:left;width:100%;background:none;border:1px solid transparent;border-radius:8px;padding:.35rem .5rem;cursor:pointer}
.shift:hover{background:var(--bg);border-color:var(--line)}
.day.weekend .shift:hover,.day.holiday .shift:hover{background:var(--bg)}
.shift .t{font-family:var(--font-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.shift .h{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-2)}
.track{position:relative;height:.65rem;border-radius:4px;background-color:var(--line-2);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:16.6667% 100%}
.bar{position:absolute;top:0;bottom:0;border-radius:4px}
.bar.day{background:var(--day)}
.bar.night{background:var(--night)}
.who{display:flex;align-items:center;gap:.45rem;font-weight:600;min-width:0}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .mk{font-family:var(--font-mono);font-size:.68rem;font-weight:500;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 .3rem}
.shift.warn{border-color:var(--warn)}
.shift.warn .mk.bad{color:var(--warn);border-color:var(--warn)}
.shift.empty .who{color:var(--warn)}
.shift.empty .track{background-image:repeating-linear-gradient(135deg,var(--warn-soft) 0 5px,transparent 5px 10px)}
.shift.dim{opacity:.32}
@media (max-width:600px){
  .day{grid-template-columns:3.6rem minmax(0,1fr)}
  .dd{font-size:1.3rem}
  .shift{grid-template-columns:auto auto 1fr;grid-template-areas:"t h who" "track track track";row-gap:.3rem}
  .shift .t{grid-area:t}.shift .h{grid-area:h}.shift .who{grid-area:who;justify-content:flex-end}.shift .track{grid-area:track}
}

/* hours */
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.6rem;margin-bottom:1.2rem}
.ro{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.65rem .8rem}
.ro .k{font-size:.74rem;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.ro .v{font-family:var(--font-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.hours{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.hr{display:grid;grid-template-columns:minmax(8rem,13rem) minmax(5rem,1fr) 4.2rem 3.6rem;gap:.4rem .9rem;align-items:center;padding:.7rem .9rem;border-top:1px solid var(--line-2)}
.hr:first-child{border-top:0}
.hname{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.hname .n{display:flex;gap:.45rem;align-items:center;font-weight:600}
.hname .sub{font-size:.76rem;color:var(--ink-2)}
.hbar{position:relative;height:.9rem;background:var(--line-2);border-radius:5px}
.hbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:hsl(var(--wh,200) 58% var(--wl))}
.hbar .mean{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.hnum{font-family:var(--font-mono);font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.hdev{font-family:var(--font-mono);font-size:.82rem;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hr.restricted .hnum::after{content:"*";color:var(--accent)}
@media (max-width:600px){
  .hr{grid-template-columns:1fr auto auto;grid-template-areas:"name num dev" "bar bar bar"}
  .hr .hname{grid-area:name}.hr .hbar{grid-area:bar}.hr .hnum{grid-area:num}.hr .hdev{grid-area:dev}
}

/* setup + team */
.step{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1rem}
.step h2{font-size:1.1rem;font-weight:700;letter-spacing:-.01em;display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:baseline}
.stepn{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.step > .note{margin:.35rem 0 .8rem}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;padding:.65rem 0;border-top:1px solid var(--line-2);align-items:center}
.wrow:first-child{border-top:0}
.wmain{display:flex;flex-wrap:wrap;gap:.35rem .7rem;align-items:center;min-width:0}
.chk{display:flex;align-items:center;gap:.6rem;font-weight:600;cursor:pointer;min-width:0}
.wacts{display:flex;gap:.9rem;align-items:center}
.offbox{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;background:var(--bg);border-radius:8px;padding:.6rem .7rem}
.offbox .chips{display:flex;flex-wrap:wrap;gap:.35rem;width:100%}
.offchip{display:inline-flex;gap:.35rem;align-items:center;font-family:var(--font-mono);font-size:.76rem;padding:.12rem .25rem .12rem .55rem;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.offchip button{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:0 .3rem;font-size:1rem;line-height:1}
.hol{padding:.7rem 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:.5rem}
.hol:first-of-type{border-top:0}
.pins{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem;margin-left:1.75rem}
.summary{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;font-size:.9rem;margin:.6rem 0 1rem;color:var(--ink-2)}
.summary b{color:var(--ink);font-family:var(--font-mono);font-weight:500}
.empty-state{border:1px dashed var(--ink-2);border-radius:12px;padding:2rem 1.2rem;text-align:center;display:flex;flex-direction:column;gap:.8rem;align-items:center}
.empty-state h2{font-size:1.2rem}
.empty-state p{margin:0;max-width:52ch;color:var(--ink-2)}

/* modal */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,16,14,.6);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:90vh;max-height:calc(100dvh - 2rem);overflow:auto;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.9rem}
.panel h2{font-size:1.15rem;letter-spacing:-.01em}
.panel .sub{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-2);margin-top:.25rem}
.cands{display:flex;flex-direction:column;gap:.35rem}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem .7rem;text-align:left;width:100%;padding:.55rem .7rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.cand:hover{border-color:var(--ink-2)}
.cand.cur{border-color:var(--accent);background:var(--accent-soft)}
.cand .nm{display:flex;gap:.5rem;align-items:center;font-weight:600;min-width:0}
.cand .hh{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-2);text-align:right}
.cand .why{grid-column:1 / -1;font-size:.78rem;color:var(--warn)}
.cand.blocked{opacity:.8}
.daypick{display:flex;flex-wrap:wrap;gap:.35rem}
.daypick button{min-width:2.9rem;padding:.4rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.85rem}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.err{color:var(--warn);font-size:.85rem;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:.6rem .9rem;border-radius:10px;display:flex;gap:.9rem;align-items:center;max-width:calc(100% - 32px);font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.shift,.cand{transition:border-color .12s,background-color .12s,color .12s}}

.ptable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ptable th,.ptable td{padding:.55rem .8rem;text-align:left;border-top:1px solid var(--line-2);white-space:nowrap}
.ptable thead th{border-top:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);background:var(--bg)}
.ptable tr.alt td{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.tblwrap{overflow-x:auto;max-width:100%}
.hol{display:inline-block;margin-left:.55rem;padding:.08rem .55rem;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.02em;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.ptable td.num,.ptable th.num{text-align:right}
.tbltools{display:flex;justify-content:flex-end;margin-bottom:.6rem}
.pubview .day .shift{cursor:default}.pubview .day .shift:hover{background:none;border-color:transparent}
.pubfoot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);text-align:center}
.gate{max-width:26rem;margin:2rem auto 0;display:flex;flex-direction:column;gap:.8rem}
.mine{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.mrow{display:grid;grid-template-columns:minmax(9rem,1.4fr) 11rem 1fr 3rem;gap:.4rem .9rem;align-items:center;padding:.7rem .9rem;border-top:1px solid var(--line-2)}
.mrow:first-child{border-top:0}.mdate{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}.mh{text-align:right}
@media (max-width:600px){.mrow{grid-template-columns:1fr auto auto}.mrow>:first-child{grid-column:1 / -1}}
</style>

<script>
//#LOGIC-START
/* ---------- dates (all strings are YYYY-MM-DD, arithmetic in UTC days so time zones never shift a date) ---------- */
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOWL=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n){return String(n).padStart(2,'0')}
function ymd(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function parseD(s){var a=s.split('-').map(Number);return {y:a[0],m:a[1]-1,d:a[2]}}
function dnum(s){var p=parseD(s);return Date.UTC(p.y,p.m,p.d)/86400000}
function fromNum(n){var t=new Date(n*86400000);return ymd(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate())}
function addDays(s,n){return fromNum(dnum(s)+n)}
function dow(s){return new Date(dnum(s)*86400000).getUTCDay()}
function fmtShort(s){var p=parseD(s);return MON[p.m]+' '+p.d}
function fmtLong(s){var p=parseD(s);return DOW[dow(s)]+' '+p.d+' '+MON[p.m]}

/* ---------- periods run from the 26th of a month to the 25th of the next; the id is the start month ---------- */
function periodStart(id){return id+'-26'}
function periodEnd(id){var a=id.split('-').map(Number);var y=a[1]===12?a[0]+1:a[0],m=a[1]===12?1:a[1]+1;return y+'-'+pad(m)+'-25'}
function periodDates(id){var out=[],e=dnum(periodEnd(id));for(var n=dnum(periodStart(id));n<=e;n++)out.push(fromNum(n));return out}
function shiftPeriodId(id,delta){var a=id.split('-').map(Number);var t=a[0]*12+(a[1]-1)+delta;return Math.floor(t/12)+'-'+pad(t%12+1)}
function periodIdFor(s){var p=parseD(s),y=p.y,m=p.m;if(p.d<26){m-=1;if(m<0){m=11;y-=1}}return y+'-'+pad(m+1)}
function periodLabel(id){var s=periodStart(id),e=periodEnd(id);var ys=s.slice(0,4),ye=e.slice(0,4);
  return ys===ye?fmtShort(s)+' – '+fmtShort(e)+', '+ye:fmtShort(s)+', '+ys+' – '+fmtShort(e)+', '+ye}

/* ---------- Jamaican public holidays (editable in the app, since extra days can be declared) ---------- */

function computeCarry(period){
  var ids=Object.keys(S.periods).filter(function(id){return id<period.id}).sort().slice(-12),c={};
  ids.forEach(function(id){
    var p=S.periods[id];if(!p||!p.slots||!p.workers||!p.workers.length)return;
    var hrs={},wk={},tot=0,totW=0,any=false;
    buildSlots(p).forEach(function(s){
      var e=p.slots[s.key];if(!e||!e.w)return;
      any=true;tot+=s.hours;hrs[e.w]=(hrs[e.w]||0)+s.hours;
      if(s.type!=='weekday'){totW+=s.hours;wk[e.w]=(wk[e.w]||0)+s.hours}
    });
    if(!any)return;
    var mean=tot/p.workers.length,meanW=totW/p.workers.length;
    p.workers.forEach(function(w){var o=c[w.id]||(c[w.id]={h:0,w:0});o.h+=(hrs[w.id]||0)-mean;o.w+=(wk[w.id]||0)-meanW});
  });
  Object.keys(c).forEach(function(id){c[id].h=Math.max(-60,Math.min(60,c[id].h));c[id].w=Math.max(-30,Math.min(30,c[id].w))});

    var id=workers[w].id,old=period.slots[s.key];

  var per={},issues={},unfilled=[],over={};
  slots.forEach(function(s){var e=period.slots[s.key];if(e&&e.w)(per[e.w]=per[e.w]||[]).push(s)});
  period.workers.forEach(function(w){
    if(!(w.maxHours>0))return;
    var cum=0;(per[w.id]||[]).slice().sort(function(a,b){return a.startMin-b.startMin}).forEach(function(s){cum+=s.hours;if(cum>w.maxHours)over[s.key]=w.maxHours});
  });

    var e=period.slots[s.key];
    if(!e||!e.w){unfilled.push(s.key);return}
    var w=period.workers.filter(function(x){return x.id===e.w})[0];
    var r=w?staticReasons(w,s):['Person is not on this period'],mine=per[e.w]||[],set={},i;
    mine.forEach(function(o){set[o.dn]=1;if(o===s)return;var pr=pairReason(o,s,LEVELS.relaxed);if(pr&&r.indexOf(pr)<0)r.push(pr)});

  period.workers.forEach(function(w){rows[w.id]={w:w,total:0,count:0,weekday:0,special:0,night:0}});
  slots.forEach(function(s){
    var e=period.slots[s.key];if(!e||!e.w||!rows[e.w])return;
    var r=rows[e.w];r.total+=s.hours;r.count++;

function lsSet(path,data){localStorage.setItem('benchrota:'+path,JSON.stringify(data))}
/* ---------- storage: private GitHub data repository ---------- */
var REM={sha:null,data:null};
function ghHeaders(){return {'Authorization':'Bearer '+ghToken(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function dataUrl(){var d=CONFIG.data;return 'https://api.github.com/repos/'+d.owner+'/'+d.repo+'/contents/'+d.path}
function b64d(x){return decodeURIComponent(escape(atob(String(x).replace(/\s/g,''))))}
function isRemotePath(path){return path==='settings/roster'||path.indexOf('periods/')===0}
function ghMsg(e){
  var st=e&&e.status;
  if(st===401)return 'GitHub rejected the token. Check it under GitHub connection.';
  if(st===403)return 'The token is not allowed to use the data repository. It needs Contents read and write on it.';
  if(st===404)return 'The data repository was not found. Create the private repository "'+CONFIG.data.repo+'" (tick Add a README) and make sure the token covers it.';
  if(st===409||st===422)return 'The data changed while saving. Try again.';
  return 'Could not reach GitHub. Check your connection and try again.';
}
async function remoteFetch(){
  var r=await fetch(dataUrl()+'?ref='+encodeURIComponent(CONFIG.data.branch),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404)return {exists:false};
  if(!r.ok)throw {status:r.status};
  var j=await r.json();
  if(!j.content)throw {status:0,big:true};
  return {exists:true,sha:j.sha,data:JSON.parse(b64d(j.content))};
}
async function remoteWrite(mutate){
  for(var attempt=0;attempt<3;attempt++){
    var cur=(attempt===0&&REM.sha&&REM.data)?{exists:true,sha:REM.sha,data:REM.data}:await remoteFetch();
    var d=cur.exists?cur.data:{roster:null,periods:{}};
    d.periods=d.periods||{};
    mutate(d);
    var body={message:'Update rota data ('+(meName()||'admin')+')',content:b64(JSON.stringify(d)),branch:CONFIG.data.branch};
    if(cur.exists)body.sha=cur.sha;
    var w=await fetch(dataUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)});
    if(w.ok){var j=await w.json();REM.sha=j.content.sha;REM.data=d;return}
    REM.sha=null;REM.data=null;
    if(w.status===409||w.status===422)continue;
    throw {status:w.status};
  }
  throw {status:409};
}
function applyRemote(d){
  S.roster={workers:(d.roster&&d.roster.workers)||[],lastAvailable:(d.roster&&d.roster.lastAvailable)||[]};
  S.periods={};Object.keys(d.periods||{}).forEach(function(id){var p=d.periods[id];if(p&&p.id)S.periods[p.id]=p});
}
async function bootData(){
  if(S.dataReady){S.gate='open';afterUnlock();render();window.scrollTo(0,0);return}
  if(!ghToken()){S.gate='ghsetup';S.gateErr=null;S.gateInfo='Add a GitHub token so schedules can be loaded from, and saved to, your private data repository.';render();return}
  S.gate='loading';S.gateErr=null;S.gateInfo=null;render();
  try{
    var cur=await remoteFetch();
    if(cur.exists){REM.sha=cur.sha;REM.data=cur.data;applyRemote(cur.data)}
    else{
      /* first time: move anything already saved in this browser into the data repository */
      REM.sha=null;REM.data=null;
      var seedR=clone(S.roster),seedP=clone(S.periods);
      await remoteWrite(function(d){d.roster=seedR;d.periods=seedP});
    }
    S.remote=true;S.dataReady=true;S.ready=true;S.gate='open';
    afterUnlock();render();window.scrollTo(0,0);
  }catch(e){S.gate='dataerror';S.gateErr=ghMsg(e);render()}
}
function persist(path,data){
  var snap=clone(data);
  writeChain=writeChain.then(function(){
    if(S.remote&&isRemotePath(path))return remoteWrite(function(d){if(path==='settings/roster')d.roster=snap;else d.periods[path.slice(8)]=snap});
    return DB?DB.doc(path).set(snap):lsSet(path,snap);
  }).catch(function(err){
    try{console.error(err)}catch(e){}
    toast(S.remote?'Not saved to GitHub: '+ghMsg(err):(err&&err.code==='invalid_argument'?'You have view-only access, so this change was not saved.':'Could not save. Your change is on screen but may be lost if you close the page.'));
  });
  return writeChain;
}
function saveRoster(){return persist('settings/roster',S.roster)}
function savePeriod(p){return persist('periods/'+p.id,p)}
async function loadAll(){
  var r,list=[];
  if(DB){
    var rs=await DB.doc('settings/roster').get();r=rs.exists?clone(rs.data()):null;
    var q=await DB.collection('periods').get();
    q.docs.forEach(function(d){if(d.exists)list.push(clone(d.data()))});
  }else{
    r=lsGet('settings/roster');
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('benchrota:periods/')===0){var v=lsGet(k.slice(10));if(v)list.push(v)}}}catch(e){}
  }
  if(r&&r.workers)S.roster={workers:r.workers,lastAvailable:r.lastAvailable||[]};
  list.forEach(function(p){if(p&&p.id)S.periods[p.id]=p});
}

/* ---------- toast + modal plumbing ---------- */
var toastTimer=null;
function toast(msg,label,fn){
  var el=document.getElementById('toast');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button type="button" id="toast-act">'+esc(label)+'</button>':'');
  el.hidden=false;
  if(label){document.getElementById('toast-act').onclick=function(){el.hidden=true;fn()}}
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},label?9000:4500);
}
function closeModal(){S.modal=null;renderModal()}

function initDraft(){
  var p=cur(),ids=S.roster.workers.map(function(w){return w.id});
  var d={pid:S.pid,avail:[],daysOff:{},hol:holidaysInPeriod(S.pid)};
  if(p){
    d.avail=p.workers.map(function(w){return w.id}).filter(function(id){return ids.indexOf(id)>=0});
    p.workers.forEach(function(w){if(w.daysOff&&w.daysOff.length)d.daysOff[w.id]=w.daysOff.slice()});
    var saved={};(p.holidays||[]).forEach(function(x){saved[x.date]=x});
    d.hol.forEach(function(x){if(saved[x.date])x.on=saved[x.date].on!==false});
    (p.holidays||[]).forEach(function(x){if(!d.hol.some(function(y){return y.date===x.date}))d.hol.push({date:x.date,name:x.name,on:x.on!==false,pins:[null,null,null]})});
    ['A','B','C'].forEach(function(id,k){d.hol.forEach(function(x){var e=p.slots[x.date+'|'+id];if(e&&e.l&&e.w&&holidaySet(p)[x.date])x.pins[k]=e.w})});
    d.hol.sort(function(a,b){return a.date<b.date?-1:1});
  }else{
    var last=S.roster.lastAvailable.filter(function(id){return ids.indexOf(id)>=0});
    d.avail=last.length?last:ids.slice();
  }
  S.draft=d;
}

function buildPeriod(){
  var d=S.draft,old=cur(),pid=S.pid;
  var workers=S.roster.workers.filter(function(w){return d.avail.indexOf(w.id)>=0}).map(function(w){
    return {id:w.id,name:w.name,no4:!!w.no4,onlyShort:!!w.onlyShort,only12day:!!(w.only12day||w.only12),only12night:!!(w.only12night||w.only12),only16:!!w.only16,days:w.days&&w.days.length&&w.days.length<7?w.days.slice():null,daytimeOnly:!!w.daytimeOnly,maxHours:w.maxHours>0?w.maxHours:null,daysOff:(d.daysOff[w.id]||[]).slice().sort()};
  });
  if(!workers.length){toast('Tick at least one available person first.');return}
  var p={id:pid,start:periodStart(pid),end:periodEnd(pid),workers:workers,
    holidays:d.hol.map(function(x){return {date:x.date,name:x.name,on:!!x.on}}),slots:{}};
  var keep=old&&!S.clearPins?old.slots:{},slots=buildSlots(p),ok={};
  slots.forEach(function(s){ok[s.key]=1});
  Object.keys(keep).forEach(function(k){var e=keep[k];if(ok[k]&&e&&e.l&&e.w&&workers.some(function(w){return w.id===e.w}))p.slots[k]={w:e.w,l:1}});
  d.hol.forEach(function(x){
    if(!x.on||dow(x.date)===0||dow(x.date)===6)return;
    ['A','B','C'].forEach(function(id,k){if(x.pins[k]&&workers.some(function(w){return w.id===x.pins[k]}))p.slots[x.date+'|'+id]={w:x.pins[k],l:1}});
  });
  var prevSlots=old?clone(old.slots):null;
  var res=generateSchedule(p);
  p.slots=res.slots;p.unfilled=res.unfilled;p.relaxed=res.relaxed;p.builtAt=new Date().toISOString();
  S.undo=prevSlots?{pid:pid,slots:prevSlots,workers:clone(old.workers),holidays:clone(old.holidays)}:null;
  S.periods[pid]=p;S.roster.lastAvailable=d.avail.slice();S.clearPins=false;
  savePeriod(p);saveRoster();
  S.tab='schedule';S.draft=null;render();window.scrollTo(0,0);
  toast(res.unfilled?'Built, but '+res.unfilled+' shift'+(res.unfilled===1?'':'s')+' could not be filled.':'Schedule built.');
}

var DOWF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function nameParts(n){var w=String(n||'').trim().split(/\s+/).filter(Boolean);return w.length?{ini:w.map(function(x){return x.charAt(0).toUpperCase()}).join(''),last:w[w.length-1]}:null}
function tableRows(p){
  var hset=holidaySet(p),byId={};p.workers.forEach(function(w){byId[w.id]=w});
  function who(d,id){var e=p.slots[d+'|'+id],w=e&&e.w?byId[e.w]:null;return w?nameParts(w.name):null}
  function ini(d,id){var n=who(d,id);return '('+(n?n.ini:'—')+')'}
  function ln(d,id){var n=who(d,id);return n?n.last:'—'}
  return periodDates(p.id).map(function(d){
    var t=dayType(d,hset),txt,pd=parseD(d);
    if(t==='weekday')txt=ln(d,'B')+' '+ini(d,'A');
    else if(t==='weekend')txt=ini(d,'B')+' '+ln(d,'C')+' / '+ln(d,'D')+' '+ini(d,'A');
    else txt=ini(d,'A')+' '+ln(d,'B')+' / '+ln(d,'C');
    return {date:pd.d+' '+MON[pd.m]+' '+pd.y,day:DOWF[dow(d)],holiday:hset[d]||null,alt:t!=='weekday',txt:txt};
  });
}
var TABLE_KEY=['Weekday: overnight surname and (evening 4-hour initials).','Weekend: (afternoon initials) day surname / night surname (morning initials).','Weekday holiday: (morning initials) day surname / night surname.','A dash means not assigned yet.'];

/* ---- PDF export (no libraries: a small PDF writer using the built-in Helvetica fonts) ---- */
function pdfText(t){
  var map={'—':'\x97','–':'\x96','’':'\x92','‘':'\x91','“':'\x93','”':'\x94','•':'\x95'};
  return Array.from(String(t)).map(function(c){var k=c.charCodeAt(0);return map[c]||(k<256?c:'?')}).join('').replace(/[\\()]/g,'\\$&');
}
function makePdf(pages){
  var objs=[];function add(o){objs.push(o);return objs.length}
  add('<< /Type /Catalog /Pages 2 0 R >>');add('');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  var kids=[];
  pages.forEach(function(c){
    var cid=objs.length+2,pid=add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cid+' 0 R >>');
    add('<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream');kids.push(pid+' 0 R');
  });
  objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
  var out='%PDF-1.4\n',offs=[];
  objs.forEach(function(o,i){offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
  var x=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  offs.forEach(function(o){out+=('0000000000'+o).slice(-10)+' 00000 n \n'});
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
  var u=new Uint8Array(out.length);for(var i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
}
function tablePdfPages(p){
  var rows=tableRows(p),perPage=33,pages=[],rh=21,L=40;
  var n=Math.max(1,Math.ceil(rows.length/perPage));
  function txt(x,y,size,bold,t,gray){return (gray!=null?gray+' g ':'0 g ')+'BT /'+(bold?'F2':'F1')+' '+size+' Tf '+x+' '+y+' Td ('+pdfText(t)+') Tj ET\n'}
  function rect(x,y,w,h,r,g,b){return r+' '+g+' '+b+' rg '+x+' '+y+' '+w+' '+h+' re f\n'}
  function line(x1,y1,x2,y2){return '0.82 G 0.5 w '+x1+' '+y1+' m '+x2+' '+y2+' l S\n'}
  for(var pg=0;pg<n;pg++){
    var c='',top=738;
    c+=txt(L,800,16,true,'Bench Rota')+txt(L,782,10,false,periodLabel(p.id)+(n>1?'  (page '+(pg+1)+' of '+n+')':''),0.35);
    c+=rect(L,top,515,22,0.92,0.94,0.93);
    c+=txt(L+8,top+7,9,true,'DATE')+txt(160,top+7,9,true,'DAY')+txt(330,top+7,9,true,'SCHEDULED');
    rows.slice(pg*perPage,(pg+1)*perPage).forEach(function(r,i){
      var yT=top-i*rh,yB=yT-rh;
      if(r.alt)c+=rect(L,yB,515,rh,0.965,0.97,0.968);
      c+=line(L,yB,555,yB);
      c+=txt(L+8,yB+7,10,false,r.date)+txt(160,yB+7,10,false,r.day)+txt(330,yB+7,10,false,r.txt);
      if(r.holiday){c+=rect(236,yB+4,40,13,0.99,0.88,0.78)+txt(240,yB+7.5,8,true,'Holiday',0.45)}
    });
    if(pg===n-1){var yK=top-Math.min(rows.length,perPage)*rh-22;TABLE_KEY.forEach(function(k,i){c+=txt(L,yK-i*11,8,false,k,0.35)})}
    pages.push(c);
  }
  return pages;
}

/* ---------- statistics (hours and days per worker) + Excel export ---------- */
function r1(x){return Math.round(x*10)/10}
function classOf(s){return s.short?'4h':(s.hours===12?(s.daytime?'12d':'12n'):(s.hours===16?'16':'other'))}
function periodStats(p){
  var slots=buildSlots(p),rows={},order=[];
  p.workers.forEach(function(w){rows[w.id]={id:w.id,name:w.name,total:0,shifts:0,weekday:0,special:0,night:0,c4:0,c12d:0,c12n:0,c16:0,dns:{}};order.push(w.id)});
  slots.forEach(function(s){
    var e=p.slots[s.key];if(!e||!e.w||!rows[e.w])return;
    var r=rows[e.w],c=classOf(s);
    r.total+=s.hours;r.shifts++;if(s.type==='weekday')r.weekday+=s.hours;else r.special+=s.hours;if(s.overnight)r.night+=s.hours;
    if(c==='4h')r.c4++;else if(c==='12d')r.c12d++;else if(c==='12n')r.c12n++;else if(c==='16')r.c16++;
    r.dns[s.dn]=1;
  });
  var days=periodDates(p.id).length,tot=0;
  order.forEach(function(id){tot+=rows[id].total});
  var avg=order.length?tot/order.length:0;
  return order.map(function(id){
    var r=rows[id],dn=Object.keys(r.dns).map(Number).sort(function(a,b){return a-b}),run=0,best=0,prev=null;
    dn.forEach(function(n){run=(prev!==null&&n===prev+1)?run+1:1;if(run>best)best=run;prev=n});
    r.days=dn.length;r.daysOff=days-dn.length;r.longest=best;r.vsAvg=r.total-avg;r.avgShift=r.shifts?r.total/r.shifts:0;r.avg=avg;return r;
  });
}
function savedPeriodIds(){
  return Object.keys(S.periods).sort().filter(function(id){var p=S.periods[id];return p&&p.slots&&Object.keys(p.slots).some(function(k){return p.slots[k]&&p.slots[k].w})});
}
function allStats(){
  var agg={},order=[];
  savedPeriodIds().forEach(function(id){
    periodStats(S.periods[id]).forEach(function(r){
      var a=agg[r.id];if(!a){a=agg[r.id]={id:r.id,name:r.name,periods:0,total:0,shifts:0,days:0,weekday:0,special:0,night:0,c4:0,c12d:0,c12n:0,c16:0};order.push(r.id)}
      a.name=r.name;a.periods++;
      ['total','shifts','days','weekday','special','night','c4','c12d','c12n','c16'].forEach(function(k){a[k]+=r[k]});

/* ---- minimal .xlsx writer (zip with stored entries, no libraries) ---- */
var CRC_T=null;
function crc32(u){
  if(!CRC_T){CRC_T=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);CRC_T[n]=c>>>0}}
  var crc=0xFFFFFFFF;for(var i=0;i<u.length;i++)crc=CRC_T[(crc^u[i])&255]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  var enc=new TextEncoder(),parts=[],cd=[],off=0;
  files.forEach(function(f){
    var name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,33,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,33,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);
    ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  });
  var cdSize=0;cd.forEach(function(x){cdSize+=x.length});
  var end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  var all=parts.concat(cd,[new Uint8Array(end.buffer)]),total=0;all.forEach(function(x){total+=x.length});
  var out=new Uint8Array(total),pos=0;all.forEach(function(x){out.set(x,pos);pos+=x.length});return out;
}
function xmlEsc(v){return String(v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}

function sheetXml(rows){
  var widths=[];
  rows.forEach(function(r){r.forEach(function(v,i){var l=String(v==null?'':v).length;widths[i]=Math.max(widths[i]||8,Math.min(40,l+2))})});
  var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>';
  widths.forEach(function(w,i){x+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'});
  x+='</cols><sheetData>';
  rows.forEach(function(r,ri){
    x+='<row r="'+(ri+1)+'">';
    r.forEach(function(v,ci){
      var ref=colName(ci)+(ri+1);
      if(v===null||v===undefined||v==='')return;
      if(typeof v==='number')x+='<c r="'+ref+'"'+(ri===0?' s="1"':'')+'><v>'+v+'</v></c>';
      else x+='<c r="'+ref+'" t="inlineStr"'+(ri===0?' s="1"':'')+'><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>';
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function makeXlsx(sheets){

  files.unshift({name:'[Content_Types].xml',data:ct+'</Types>'},
    {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},

    {name:'xl/_rels/workbook.xml.rels',data:rel},
    {name:'xl/styles.xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet '+NS+'><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDE8E4"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'});

}

  toast('Publishing…');
  try{
    var fileSha=null,r=await fetch(url+'?ref='+encodeURIComponent(g.branch),{headers:H,cache:'no-store'});
    if(r.ok){fileSha=(await r.json()).sha}else if(r.status!==404){throw {status:r.status}}
    var body={message:'Publish schedule ('+(meName()||'admin')+')',content:b64(JSON.stringify(buildSnapshot(),null,1)),branch:g.branch};
    if(fileSha)body.sha=fileSha;
    var w=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
    if(!w.ok)throw {status:w.status};
    toast('Published. The public page usually updates within a few minutes.');
  }catch(e){
    var st=e&&e.status;
    toast(st===401?'GitHub rejected the token. Check it under Publishing setup.':st===403?'The token is not allowed to write to this repository.':st===404?'Repository or file not found. Check the token covers this repository.':(st===409||st===422)?'The file changed on GitHub. Try publishing again.':'Could not reach GitHub. Check your connection.');
  }
}
function pickAdminPid(){
  var ui=lsGet('settings/ui');if(ui&&ui.pid&&S.periods[ui.pid])return ui.pid;
  var ids=Object.keys(S.periods).filter(function(id){var p=S.periods[id];return p&&p.slots&&Object.keys(p.slots).length}).sort();
  return ids.length?ids[ids.length-1]:periodIdFor(addDays(todayStr(),10));
}
function afterUnlock(){
  S.pid=pickAdminPid();S.hl='';S.draft=null;S.expanded={};
  S.tab=S.periods[S.pid]?'schedule':'setup';
  if(S.tab==='setup')initDraft();
}
function leaveAdmin(){
  S.view='public';S.modal=null;S.hl='';S.pid=pickPubPid();
  try{sessionStorage.removeItem('benchrota:admin')}catch(e){}
  render();window.scrollTo(0,0);
}
function withTimeout(pr,ms){return Promise.race([pr,new Promise(function(r){setTimeout(function(){r(null)},ms)})])}
function saveBlob(name,text,type){
  var a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500);
}
async function initBackend(){
  DB=null;U=null;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  DL={save:function(o){saveBlob(o.filename,o.data,'text/csv');return Promise.resolve()}};
  S.mode='local';
  try{await loadAll()}catch(err){try{console.error(err)}catch(e){}}
  S.backendReady=true;
}
async function enterAdmin(){
  S.view='admin';S.gate='loading';S.gateErr=null;S.gateInfo=null;render();
  try{sessionStorage.setItem('benchrota:admin','1')}catch(e){}
  if(!S.backendReady)await initBackend();
  loadAdmins();
  var me=null;try{me=sessionStorage.getItem('benchrota:me')}catch(e){}
  if(me&&S.admins.some(function(x){return x.id===me})){S.me=me;unlock();return}
  S.gate='login';render();
}
async function unlock(){
  S.unlocked=true;S.gateErr=null;S.gateInfo=null;
  try{sessionStorage.setItem('benchrota:me',S.me)}catch(e){}
  await bootData();
}
function buildSnapshot(){
  var snap={at:new Date().toISOString(),periods:{}};
  Object.keys(S.periods).forEach(function(id){var p=S.periods[id];
    snap.periods[id]={id:id,workers:p.workers.map(function(w){return {id:w.id,name:w.name}}),holidays:p.holidays||[],slots:p.slots}});
  return snap;
}
function publishPublic(){
  saveBlob('schedule.json',JSON.stringify(buildSnapshot(),null,1),'application/json');
  toast('schedule.json downloaded. Upload it to the repository to update the public page.');
}
function backupAll(){
  saveBlob('bench-rota-backup-'+todayStr()+'.json',JSON.stringify({kind:'bench-rota-backup',version:1,roster:S.roster,periods:S.periods},null,1),'application/json');
  toast('Backup downloaded. Keep it private: it includes restrictions.');
}
function restoreFrom(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(d.kind!=='bench-rota-backup'||!d.periods)throw new Error('bad');
      if(d.roster&&d.roster.workers){S.roster={workers:d.roster.workers,lastAvailable:d.roster.lastAvailable||[]};saveRoster()}
      Object.keys(d.periods).forEach(function(id){var p=d.periods[id];if(p&&p.id){S.periods[p.id]=p;savePeriod(p)}});
      afterUnlock();render();toast('Backup restored.');
    }catch(e){toast('That file is not a Bench Rota backup.')}
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
var ACT={
  ptab:function(el){S.ptab=el.dataset.tab;render()},
  ppprev:function(){S.pid=shiftPeriodId(S.pid,-1);S.hl='';render();window.scrollTo(0,0)},
  ppnext:function(){S.pid=shiftPeriodId(S.pid,1);S.hl='';render();window.scrollTo(0,0)},
  'go-admin':function(){enterAdmin()},
  'to-public':function(){leaveAdmin()},
  lock:function(){S.unlocked=false;S.me=null;S.dataReady=false;S.remote=false;try{sessionStorage.removeItem('benchrota:me')}catch(e){}leaveAdmin()},
  login:async function(){
    var em=pwv('em').trim().toLowerCase(),pw=pwv('pw1');
    var a=S.admins.filter(function(x){return x.email===em})[0];
    var ok=a&&(await sha(a.salt+pw))===a.hash;
    if(!ok){await new Promise(function(r){setTimeout(r,700)});S.gateErr='Incorrect email or password.';render();return}
    S.me=a.id;unlock();
  },
  'request-open':function(){S.gate='request';S.gateErr=null;S.gateInfo=null;render()},
  'back-login':function(){S.gate='login';S.gateErr=null;S.gateInfo=null;render()},
  'have-code':function(){S.gate='verify';S.gateErr=null;S.gateInfo=null;render()},
  'send-code':async function(){
    var nm=pwv('nm').trim(),em=pwv('em').trim().toLowerCase();
    if(!nm){S.gateErr='Enter your name.';render();return}
    if(!emailOk(em)){S.gateErr='Enter a valid email address.';render();return}
    if(S.admins.some(function(x){return x.email===em})){S.gateErr='That email already has a profile. Sign in instead.';render();return}
    if(!mailReady()){S.gateErr='Email sending is not set up yet. Fill in the settings at the top of the page script (see README).';render();return}
    var code=newCode(),salt=uid();
    S.gateErr=null;toast('Sending code…');
    try{
      await sendApprovalEmail(nm,em,code);
      S.pending={name:nm,email:em,salt:salt,hash:await sha(salt+code),exp:Date.now()+CONFIG.codeMinutes*60000,tries:0};
      await persist('settings/pending',S.pending);
      S.gate='verify';S.gateInfo='A code was emailed to the approver. Ask them for it. It expires in '+CONFIG.codeMinutes+' minutes.';render();
    }catch(e){S.gateErr='The email could not be sent ('+((e&&e.message)?String(e.message).slice(0,180):'unknown error')+'). Check the EmailJS settings and try again.';render()}
  },
  'verify-code':async function(){
    var code=pwv('vc').trim().toUpperCase().replace(/\s+/g,''),a=pwv('pw1'),b=pwv('pw2'),pd=S.pending;
    if(!pendingOk()){S.pending=null;persist('settings/pending',null);S.gateErr='That code has expired. Request a new one.';render();return}
    if(a.length<8){S.gateErr='Use at least 8 characters for the password.';render();return}
    if(a!==b){S.gateErr='The two passwords do not match.';render();return}
    if((await sha(pd.salt+code))!==pd.hash){
      pd.tries=(pd.tries||0)+1;
      if(pd.tries>=5){S.pending=null;persist('settings/pending',null);S.gateErr='Too many wrong codes. Request a new one.'}
      else{persist('settings/pending',pd);S.gateErr='Incorrect code.'}
      render();return}
    var salt=uid(),prof={id:uid(),name:pd.name,email:pd.email,salt:salt,hash:await sha(salt+a),at:new Date().toISOString()};
    S.admins.push(prof);await saveAdmins();
    S.pending=null;persist('settings/pending',null);
    S.me=prof.id;unlock();toast('Welcome, '+prof.name+'. Your admin profile is ready.');
  },
  'save-pw':async function(){
    var o=pwv('pw0'),a=pwv('pw1'),b=pwv('pw2'),m=S.admins.filter(function(x){return x.id===S.me})[0];
    if(!m)return;
    if((await sha(m.salt+o))!==m.hash){S.gateErr='Current password is incorrect.';render();return}
    if(a.length<8){S.gateErr='Use at least 8 characters.';render();return}
    if(a!==b){S.gateErr='The two new passwords do not match.';render();return}
    m.salt=uid();m.hash=await sha(m.salt+a);await saveAdmins();
    S.gate='open';S.gateErr=null;render();toast('Password changed.');
  },
  'gh-open':function(){if(!S.me)return;S.gate='ghsetup';S.gateErr=null;render()},
  'save-token':function(){
    var t=pwv('tk').trim();if(!S.me)return;
    if(!t){S.gateErr='Paste the token first.';render();return}
    try{localStorage.setItem('benchrota:ghtoken',t)}catch(e){S.gateErr='This browser would not save the token.';render();return}
    S.gateErr=null;
    if(!S.dataReady){bootData();return}
    S.gate='open';render();toast('Token saved in this browser.');
  },
  'remove-token':function(){try{localStorage.removeItem('benchrota:ghtoken')}catch(e){}S.gate=S.dataReady?'open':'ghsetup';S.gateErr=null;render();toast('Token removed.')},
  'retry-load':function(){if(S.me)bootData()},
  'download-json':function(){publishPublic()},
  'change-pw-open':function(){S.gate='change';S.gateErr=null;render()},
  'cancel-pw':function(){S.gate=S.dataReady?'open':'dataerror';S.gateErr=S.dataReady?null:'Schedules are not loaded yet. Add a token and try again.';render()},
  publish:function(){if(S.me)publishToGitHub()},
  'export-pdf':function(){exportTablePdf()},
  'export-stats':function(){if(S.me)exportStatsXlsx()},
  backup:function(){backupAll()},
  restore:function(){var f=document.getElementById('restore-file');if(f)f.click()},
  tab:function(el){setTab(el.dataset.tab)},
  pprev:function(){goPeriod(shiftPeriodId(S.pid,-1))},
  pnext:function(){goPeriod(shiftPeriodId(S.pid,1))},
  shift:function(el){S.modal={type:'shift',key:el.dataset.key,pin:true};renderModal()},
  'close-modal':closeModal,
  assign:function(el){assign(el.dataset.id)},
  unassign:function(){var p=cur();delete p.slots[S.modal.key];savePeriod(p);closeModal();render()},
  'new-worker':function(){S.modal={type:'worker',id:null,draft:{name:'',no4:false,onlyShort:false,only12day:false,only12night:false,only16:false,daytimeOnly:false,maxHours:'',days:[0,1,2,3,4,5,6]}};renderModal()},
  'edit-worker':function(el){
    var w=S.roster.workers.filter(function(x){return x.id===el.dataset.id})[0];if(!w)return;
    S.modal={type:'worker',id:w.id,draft:{name:w.name,no4:!!w.no4,onlyShort:!!w.onlyShort,only12day:!!(w.only12day||w.only12),only12night:!!(w.only12night||w.only12),only16:!!w.only16,daytimeOnly:!!w.daytimeOnly,maxHours:w.maxHours>0?String(w.maxHours):'',days:w.days&&w.days.length?w.days.slice():[0,1,2,3,4,5,6]}};renderModal();
  },
  'wk-day':function(el){
    var d=S.modal.draft,x=Number(el.dataset.d),i=d.days.indexOf(x);
    if(i>=0)d.days.splice(i,1);else d.days.push(x);
    S.modal.err=null;renderModal();
  },
  'save-worker':function(){
    var m=S.modal,d=m.draft,name=d.name.trim();
    if(!name){m.err='Enter a name.';renderModal();return}
    if(!d.days.length){m.err='Choose at least one day this person can work.';renderModal();return}
    if(d.daytimeOnly&&(d.only12night||d.only16)&&!d.only12day&&!d.onlyShort){m.err='12-hour night and 16-hour shifts run overnight, so they cannot be combined with daytime only unless 4-hour or 12-hour day shifts are also ticked.';renderModal();return}
    if(d.only16&&!d.only12day&&!d.only12night&&!d.onlyShort&&!d.days.some(function(x){return x>=1&&x<=5})){m.err='16-hour shifts only happen Monday to Friday, so choose at least one weekday.';renderModal();return}
    var mx=String(d.maxHours||'').trim();
    if(mx&&!/^\d{1,3}$/.test(mx)||mx&&Number(mx)<1){m.err='Enter a whole number of hours, or leave it blank for no limit.';renderModal();return}
    var rec={id:m.id||uid(),name:name,no4:!!d.no4,onlyShort:!!d.onlyShort,only12day:!!d.only12day,only12night:!!d.only12night,only16:!!d.only16,daytimeOnly:!!d.daytimeOnly,maxHours:mx?Number(mx):null,days:d.days.length===7?null:d.days.slice()};
    if(m.id){S.roster.workers=S.roster.workers.map(function(w){return w.id===m.id?rec:w})}
    else{S.roster.workers.push(rec);if(S.draft)S.draft.avail.push(rec.id)}
    saveRoster();S.modal=null;render();
  },
  'ask-delete':function(){S.modal.confirm=true;renderModal()},
  'delete-worker':function(){
    var id=S.modal.id;
    S.roster.workers=S.roster.workers.filter(function(w){return w.id!==id});
    S.roster.lastAvailable=S.roster.lastAvailable.filter(function(x){return x!==id});
    if(S.draft)S.draft.avail=S.draft.avail.filter(function(x){return x!==id});
    saveRoster();S.modal=null;render();
  },
  'toggle-off':function(el){S.expanded[el.dataset.id]=!S.expanded[el.dataset.id];render()},
  'add-off':function(el){
    var id=el.dataset.id,inp=document.getElementById('off-'+id),v=inp&&inp.value;
    if(!v){toast('Pick a date first.');return}
    if(v<periodStart(S.pid)||v>periodEnd(S.pid)){toast('That date is outside this period.');return}
    var a=S.draft.daysOff[id]=S.draft.daysOff[id]||[];if(a.indexOf(v)<0)a.push(v);render();
  },
  'rm-off':function(el){var a=S.draft.daysOff[el.dataset.id]||[];a.splice(a.indexOf(el.dataset.date),1);render()},
  'sel-all':function(){S.draft.avail=S.roster.workers.map(function(w){return w.id});render()},
  'sel-none':function(){S.draft.avail=[];render()},
  'sel-last':function(){var ids=S.roster.workers.map(function(w){return w.id});S.draft.avail=S.roster.lastAvailable.filter(function(x){return ids.indexOf(x)>=0});render()},
  'add-hol':function(){
    var dt=document.getElementById('hol-date').value,nm=document.getElementById('hol-name').value.trim()||'Declared holiday';
    if(!dt){toast('Pick the holiday date first.');return}
    if(dt<periodStart(S.pid)||dt>periodEnd(S.pid)){toast('That date is outside this period.');return}
    var ex=S.draft.hol.filter(function(x){return x.date===dt})[0];
    if(ex){ex.on=true}else{S.draft.hol.push({date:dt,name:nm,on:true,pins:[null,null,null]});S.draft.hol.sort(function(a,b){return a.date<b.date?-1:1})}
    render();
  },
  build:buildPeriod,
  rebuild:function(){rerun(false)},
  'clear-sched':function(){clearSchedule()},
  fill:function(){rerun(true)},
  undo:function(){doUndo()},
  'export-sched':function(){exportCSV('sched')},
  'export-hours':function(){exportCSV('hours')},
  'load-example':function(){
    var names=['Example 1','Example 2','Example 3','Example 4','Example 5','Example 6','Example 7','Example 8','Example 9'];
    S.roster.workers=names.map(function(n,i){return {id:uid(),name:'Example lab technologist '+(i+1),onlyShort:i===6,daytimeOnly:i===7,days:i===7?[5,6]:null}});
    saveRoster();if(S.draft)S.draft.avail=S.roster.workers.map(function(w){return w.id});
    render();toast('Example team added. Rename or remove them under Team.');
  }
};
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('backdrop')){closeModal();return}
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,okp={'export-pdf':1,ptab:1,ppprev:1,ppnext:1,'go-admin':1},okg={'retry-load':1,'gh-open':1,lock:1,login:1,'to-public':1,'request-open':1,'back-login':1,'have-code':1,'send-code':1,'verify-code':1,'save-pw':1,'cancel-pw':1,'save-token':1,'remove-token':1};
  if(S.view==='public'&&!okp[a])return;
  if(S.view==='admin'&&S.gate!=='open'&&!okg[a])return;
  var f=ACT[a];if(f)f(el,e);
});
document.addEventListener('change',function(e){
  var el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  if(b==='avail'){
    var a=S.draft.avail,id=el.dataset.id,i=a.indexOf(id);
    if(el.checked&&i<0)a.push(id);if(!el.checked&&i>=0)a.splice(i,1);render();
  }else if(b==='hol-on'){S.draft.hol[Number(el.dataset.i)].on=el.checked;render()}
  else if(b==='pin'){S.draft.hol[Number(el.dataset.i)].pins[Number(el.dataset.k)]=el.value||null}
  else if(b==='clear-pins'){S.clearPins=el.checked}
  else if(b==='hl'){S.hl=el.value;render()}
  else if(b==='who'){S.who=el.value;render()}
  else if(b==='restore-file'){if(el.files&&el.files[0])restoreFrom(el.files[0]);el.value=''}
  else if(b==='pin-toggle'){S.modal.pin=el.checked}
  else if(b==='w-short'){var dd=S.modal.draft;dd.onlyShort=el.checked;if(el.checked)dd.no4=false;S.modal.err=null;renderModal()}
  else if(b==='w-no4'){var d3=S.modal.draft;d3.no4=el.checked;if(el.checked)d3.onlyShort=false;S.modal.err=null;renderModal()}
  else if(b==='w-12d'||b==='w-12n'||b==='w-16'){var d2=S.modal.draft;d2[b==='w-12d'?'only12day':(b==='w-12n'?'only12night':'only16')]=el.checked;S.modal.err=null;renderModal()}
  else if(b==='w-day'){S.modal.draft.daytimeOnly=el.checked}
});
document.addEventListener('input',function(e){
  var el=e.target;if(!el.dataset)return;
  if(el.dataset.bind==='wname'){S.modal.draft.name=el.value;S.modal.err=null}
  else if(el.dataset.bind==='wmax'){S.modal.draft.maxHours=el.value;S.modal.err=null}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.modal)closeModal();
  if(e.key==='Enter'&&S.view==='admin'&&S.gate!=='open'&&e.target.id&&/^(pw[0-2]|em|nm|vc|tk)$/.test(e.target.id)){e.preventDefault();var b=document.querySelector('.gate .btn.primary');if(b)b.click()}
  if(e.key==='Enter'&&S.modal&&S.modal.type==='worker'&&e.target.id==='wname'){e.preventDefault();ACT['save-worker']()}
});

/* ---------- start ---------- */
async function boot(){
  await loadSnap();S.pid=pickPubPid();render();
  var flag=false;try{flag=sessionStorage.getItem('benchrota:admin')==='1'}catch(e){}
  if(flag)enterAdmin();
}
boot();
})();
</script>
