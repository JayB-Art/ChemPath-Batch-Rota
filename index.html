<!doctype html>
<html data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Schibsted+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
/* Layout: one working column. The header carries period navigation and four tabs (Schedule, Hours, Setup, Team).
   Schedule is a day-by-day ledger; each shift bar sits on a 24-hour lab day that starts at 08:30. */
:root{
  --bg:#EDF1EF; --surface:#FAFCFB; --ink:#13201E; --ink-2:#506360;
  --line:#D2DBD8; --line-2:#E3EAE7;
  --accent:#B8105C; --on-accent:#FFFFFF; --accent-soft:#F6DCE8;
  --day:#4E9E92; --night:#233F52;
  --ok:#1B7A4E; --warn:#B3261E; --warn-soft:#F8DEDB;
  --wl:42%;
  --font-ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1715; --surface:#16211F; --ink:#E5EEEB; --ink-2:#9BAFAA;
    --line:#2B3C39; --line-2:#22312E;
    --accent:#FF74AE; --on-accent:#2A0A1A; --accent-soft:#3A1828;
    --day:#5BB5A8; --night:#7FA6C2;
    --ok:#5ED59C; --warn:#FF8A80; --warn-soft:#3A1E1C;
    --wl:64%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1715; --surface:#16211F; --ink:#E5EEEB; --ink-2:#9BAFAA;
  --line:#2B3C39; --line-2:#22312E;
  --accent:#FF74AE; --on-accent:#2A0A1A; --accent-soft:#3A1828;
  --day:#5BB5A8; --night:#7FA6C2;
  --ok:#5ED59C; --warn:#FF8A80; --warn-soft:#3A1E1C;
  --wl:64%; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.45;
  padding-block:20px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1000px;margin:0 auto}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.brandline{display:flex;flex-wrap:wrap;gap:.25rem .9rem;align-items:baseline;justify-content:space-between;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.brandline b{color:var(--ink);font-weight:500}
.store{letter-spacing:.04em;text-transform:none}
.pnav{display:flex;align-items:center;gap:.6rem;margin-top:.9rem}
.plabel{min-width:0;flex:1}
.plabel h1{font-size:clamp(1.45rem,1rem + 2.6vw,2.3rem);font-weight:700;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums}
.pmeta{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;margin-top:.35rem;color:var(--ink-2);font-size:.85rem}
.iconbtn{flex:none;width:2.6rem;height:2.6rem;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.iconbtn:hover{border-color:var(--ink-2)}
.iconbtn svg{width:1.1rem;height:1.1rem}
.status{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:600;padding:.12rem .55rem;border-radius:99px;background:var(--line-2);color:var(--ink)}
.status::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--ink-2)}
.status.built::before{background:var(--ok)}
.status.todo::before{background:var(--accent)}
.tabs{display:flex;gap:.1rem;margin-top:1.1rem;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:.65rem .95rem;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:1.25rem}

/* shared controls */
.btn{padding:.55rem .95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:.35rem .65rem;font-size:.82rem}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:.2rem 0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label,.lbl{font-size:.78rem;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
input[type=text],input[type=date],input[type=password],select{font:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--accent);flex:none;margin:0}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.grow{flex:1}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:.08rem .5rem;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.dot{display:inline-block;width:.62rem;height:.62rem;border-radius:50%;flex:none;background:hsl(var(--wh,200) 58% var(--wl))}
.muted{color:var(--ink-2)}
.note{color:var(--ink-2);font-size:.88rem;max-width:62ch}

/* toolbar + notices */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.notice h3{font-size:.95rem;margin-bottom:.35rem}
.notice ul{margin:.3rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.15rem}
.notice li button{background:none;border:0;padding:.1rem 0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;font-size:.8rem;color:var(--ink-2);margin-bottom:.4rem}
.legend .sw{display:inline-block;width:1.3rem;height:.6rem;border-radius:3px;vertical-align:middle;margin-right:.35rem}

/* schedule ledger */
.wk{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:1.4rem 0 .35rem}
.day{display:grid;grid-template-columns:4.8rem minmax(0,1fr);gap:.4rem .6rem;padding:.65rem .5rem;border-top:1px solid var(--line)}
.day.weekend,.day.holiday{background:var(--surface);border-radius:10px;border:1px solid var(--line);margin:.2rem 0}
.dnum{display:flex;flex-direction:column;line-height:1.1}
.dw{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.dd{font-size:1.6rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dm{font-size:.78rem;color:var(--ink-2)}
.dtag{grid-column:2;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.78rem;color:var(--ink-2);min-height:1.2rem}
.shifts{grid-column:2;display:flex;flex-direction:column;gap:.1rem}
.day > .dnum{grid-row:1 / span 2}
.shift{display:grid;grid-template-columns:11rem 2.2rem minmax(4rem,1fr) minmax(7.5rem,13rem);gap:.6rem;align-items:center;text-align:left;width:100%;background:none;border:1px solid transparent;border-radius:8px;padding:.35rem .5rem;cursor:pointer}
.shift:hover{background:var(--bg);border-color:var(--line)}
.day.weekend .shift:hover,.day.holiday .shift:hover{background:var(--bg)}
.shift .t{font-family:var(--font-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.shift .h{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-2)}
.track{position:relative;height:.65rem;border-radius:4px;background-color:var(--line-2);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:16.6667% 100%}
.bar{position:absolute;top:0;bottom:0;border-radius:4px}
.bar.day{background:var(--day)}
.bar.night{background:var(--night)}
.who{display:flex;align-items:center;gap:.45rem;font-weight:600;min-width:0}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .mk{font-family:var(--font-mono);font-size:.68rem;font-weight:500;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 .3rem}
.shift.warn{border-color:var(--warn)}
.shift.warn .mk.bad{color:var(--warn);border-color:var(--warn)}
.shift.empty .who{color:var(--warn)}
.shift.empty .track{background-image:repeating-linear-gradient(135deg,var(--warn-soft) 0 5px,transparent 5px 10px)}
.shift.dim{opacity:.32}
@media (max-width:600px){
  .day{grid-template-columns:3.6rem minmax(0,1fr)}
  .dd{font-size:1.3rem}
  .shift{grid-template-columns:auto auto 1fr;grid-template-areas:"t h who" "track track track";row-gap:.3rem}
  .shift .t{grid-area:t}.shift .h{grid-area:h}.shift .who{grid-area:who;justify-content:flex-end}.shift .track{grid-area:track}
}

/* hours */
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.6rem;margin-bottom:1.2rem}
.ro{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.65rem .8rem}
.ro .k{font-size:.74rem;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.ro .v{font-family:var(--font-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.hours{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.hr{display:grid;grid-template-columns:minmax(8rem,13rem) minmax(5rem,1fr) 4.2rem 3.6rem;gap:.4rem .9rem;align-items:center;padding:.7rem .9rem;border-top:1px solid var(--line-2)}
.hr:first-child{border-top:0}
.hname{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.hname .n{display:flex;gap:.45rem;align-items:center;font-weight:600}
.hname .sub{font-size:.76rem;color:var(--ink-2)}
.hbar{position:relative;height:.9rem;background:var(--line-2);border-radius:5px}
.hbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:hsl(var(--wh,200) 58% var(--wl))}
.hbar .mean{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.hnum{font-family:var(--font-mono);font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
.hdev{font-family:var(--font-mono);font-size:.82rem;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hr.restricted .hnum::after{content:"*";color:var(--accent)}
@media (max-width:600px){
  .hr{grid-template-columns:1fr auto auto;grid-template-areas:"name num dev" "bar bar bar"}
  .hr .hname{grid-area:name}.hr .hbar{grid-area:bar}.hr .hnum{grid-area:num}.hr .hdev{grid-area:dev}
}

/* setup + team */
.step{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:1rem 1.1rem;margin-bottom:1rem}
.step h2{font-size:1.1rem;font-weight:700;letter-spacing:-.01em;display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:baseline}
.stepn{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
.step > .note{margin:.35rem 0 .8rem}
.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;padding:.65rem 0;border-top:1px solid var(--line-2);align-items:center}
.wrow:first-child{border-top:0}
.wmain{display:flex;flex-wrap:wrap;gap:.35rem .7rem;align-items:center;min-width:0}
.chk{display:flex;align-items:center;gap:.6rem;font-weight:600;cursor:pointer;min-width:0}
.wacts{display:flex;gap:.9rem;align-items:center}
.offbox{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:.5rem;align-items:flex-end;background:var(--bg);border-radius:8px;padding:.6rem .7rem}
.offbox .chips{display:flex;flex-wrap:wrap;gap:.35rem;width:100%}
.offchip{display:inline-flex;gap:.35rem;align-items:center;font-family:var(--font-mono);font-size:.76rem;padding:.12rem .25rem .12rem .55rem;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.offchip button{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:0 .3rem;font-size:1rem;line-height:1}
.hol{padding:.7rem 0;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:.5rem}
.hol:first-of-type{border-top:0}
.pins{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem;margin-left:1.75rem}
.summary{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;font-size:.9rem;margin:.6rem 0 1rem;color:var(--ink-2)}
.summary b{color:var(--ink);font-family:var(--font-mono);font-weight:500}
.empty-state{border:1px dashed var(--ink-2);border-radius:12px;padding:2rem 1.2rem;text-align:center;display:flex;flex-direction:column;gap:.8rem;align-items:center}
.empty-state h2{font-size:1.2rem}
.empty-state p{margin:0;max-width:52ch;color:var(--ink-2)}

/* modal */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,16,14,.6);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:90vh;max-height:calc(100dvh - 2rem);overflow:auto;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.9rem}
.panel h2{font-size:1.15rem;letter-spacing:-.01em}
.panel .sub{font-family:var(--font-mono);font-size:.8rem;color:var(--ink-2);margin-top:.25rem}
.cands{display:flex;flex-direction:column;gap:.35rem}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem .7rem;text-align:left;width:100%;padding:.55rem .7rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.cand:hover{border-color:var(--ink-2)}
.cand.cur{border-color:var(--accent);background:var(--accent-soft)}
.cand .nm{display:flex;gap:.5rem;align-items:center;font-weight:600;min-width:0}
.cand .hh{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-2);text-align:right}
.cand .why{grid-column:1 / -1;font-size:.78rem;color:var(--warn)}
.cand.blocked{opacity:.8}
.daypick{display:flex;flex-wrap:wrap;gap:.35rem}
.daypick button{min-width:2.9rem;padding:.4rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.85rem}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.err{color:var(--warn);font-size:.85rem;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:.6rem .9rem;border-radius:10px;display:flex;gap:.9rem;align-items:center;max-width:calc(100% - 32px);font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.shift,.cand{transition:border-color .12s,background-color .12s,color .12s}}

.pubview .day .shift{cursor:default}.pubview .day .shift:hover{background:none;border-color:transparent}
.pubfoot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);text-align:center}
.gate{max-width:26rem;margin:2rem auto 0;display:flex;flex-direction:column;gap:.8rem}
.mine{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.mrow{display:grid;grid-template-columns:minmax(9rem,1.4fr) 11rem 1fr 3rem;gap:.4rem .9rem;align-items:center;padding:.7rem .9rem;border-top:1px solid var(--line-2)}
.mrow:first-child{border-top:0}.mdate{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}.mh{text-align:right}
@media (max-width:600px){.mrow{grid-template-columns:1fr auto auto}.mrow>:first-child{grid-column:1 / -1}}
</style>

<script>
//#LOGIC-START
/* ---------- dates (all strings are YYYY-MM-DD, arithmetic in UTC days so time zones never shift a date) ---------- */
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOWL=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n){return String(n).padStart(2,'0')}
function ymd(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function parseD(s){var a=s.split('-').map(Number);return {y:a[0],m:a[1]-1,d:a[2]}}
function dnum(s){var p=parseD(s);return Date.UTC(p.y,p.m,p.d)/86400000}
function fromNum(n){var t=new Date(n*86400000);return ymd(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate())}
function addDays(s,n){return fromNum(dnum(s)+n)}
function dow(s){return new Date(dnum(s)*86400000).getUTCDay()}
function fmtShort(s){var p=parseD(s);return MON[p.m]+' '+p.d}
function fmtLong(s){var p=parseD(s);return DOW[dow(s)]+' '+p.d+' '+MON[p.m]}

/* ---------- periods run from the 26th of a month to the 25th of the next; the id is the start month ---------- */
function periodStart(id){return id+'-26'}
function periodEnd(id){var a=id.split('-').map(Number);var y=a[1]===12?a[0]+1:a[0],m=a[1]===12?1:a[1]+1;return y+'-'+pad(m)+'-25'}
function periodDates(id){var out=[],e=dnum(periodEnd(id));for(var n=dnum(periodStart(id));n<=e;n++)out.push(fromNum(n));return out}
function shiftPeriodId(id,delta){var a=id.split('-').map(Number);var t=a[0]*12+(a[1]-1)+delta;return Math.floor(t/12)+'-'+pad(t%12+1)}
function periodIdFor(s){var p=parseD(s),y=p.y,m=p.m;if(p.d<26){m-=1;if(m<0){m=11;y-=1}}return y+'-'+pad(m+1)}
function periodLabel(id){var s=periodStart(id),e=periodEnd(id);var ys=s.slice(0,4),ye=e.slice(0,4);
  return ys===ye?fmtShort(s)+' – '+fmtShort(e)+', '+ye:fmtShort(s)+', '+ys+' – '+fmtShort(e)+', '+ye}

/* ---------- Jamaican public holidays (editable in the app, since extra days can be declared) ---------- */
function easter(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return ymd(y,mo-1,da)}
function jmHolidays(y){
  var list=[];function add(d,n){list.push({date:d,name:n})}
  function sunToMon(d){return dow(d)===0?addDays(d,1):d}
  add(sunToMon(y+'-01-01'),"New Year's Day");
  var e=easter(y);

/* ---------- state changes ---------- */
function initDraft(){
  var p=cur(),ids=S.roster.workers.map(function(w){return w.id});
  var d={pid:S.pid,avail:[],daysOff:{},hol:holidaysInPeriod(S.pid)};
  if(p){
    d.avail=p.workers.map(function(w){return w.id}).filter(function(id){return ids.indexOf(id)>=0});
    p.workers.forEach(function(w){if(w.daysOff&&w.daysOff.length)d.daysOff[w.id]=w.daysOff.slice()});
    var saved={};(p.holidays||[]).forEach(function(x){saved[x.date]=x});
    d.hol.forEach(function(x){if(saved[x.date])x.on=saved[x.date].on!==false});
    (p.holidays||[]).forEach(function(x){if(!d.hol.some(function(y){return y.date===x.date}))d.hol.push({date:x.date,name:x.name,on:x.on!==false,pins:[null,null,null]})});
    ['A','B','C'].forEach(function(id,k){d.hol.forEach(function(x){var e=p.slots[x.date+'|'+id];if(e&&e.l&&e.w&&holidaySet(p)[x.date])x.pins[k]=e.w})});
    d.hol.sort(function(a,b){return a.date<b.date?-1:1});
  }else{
    var last=S.roster.lastAvailable.filter(function(id){return ids.indexOf(id)>=0});
    d.avail=last.length?last:ids.slice();
  }
  S.draft=d;
}

}

function buildPeriod(){
  var d=S.draft,old=cur(),pid=S.pid;
  var workers=S.roster.workers.filter(function(w){return d.avail.indexOf(w.id)>=0}).map(function(w){
    return {id:w.id,name:w.name,onlyShort:!!w.onlyShort,only12:!!w.only12,only16:!!w.only16,days:w.days&&w.days.length&&w.days.length<7?w.days.slice():null,daytimeOnly:!!w.daytimeOnly,maxHours:w.maxHours>0?w.maxHours:null,daysOff:(d.daysOff[w.id]||[]).slice().sort()};
  });
  if(!workers.length){toast('Tick at least one available person first.');return}
  var p={id:pid,start:periodStart(pid),end:periodEnd(pid),workers:workers,
    holidays:d.hol.map(function(x){return {date:x.date,name:x.name,on:!!x.on}}),slots:{}};
  var keep=old&&!S.clearPins?old.slots:{},slots=buildSlots(p),ok={};
  slots.forEach(function(s){ok[s.key]=1});
  Object.keys(keep).forEach(function(k){var e=keep[k];if(ok[k]&&e&&e.l&&e.w&&workers.some(function(w){return w.id===e.w}))p.slots[k]={w:e.w,l:1}});
  d.hol.forEach(function(x){
    if(!x.on||dow(x.date)===0||dow(x.date)===6)return;
    ['A','B','C'].forEach(function(id,k){if(x.pins[k]&&workers.some(function(w){return w.id===x.pins[k]}))p.slots[x.date+'|'+id]={w:x.pins[k],l:1}});
  });
  var prevSlots=old?clone(old.slots):null;
  var res=generateSchedule(p);
  p.slots=res.slots;p.unfilled=res.unfilled;p.relaxed=res.relaxed;p.builtAt=new Date().toISOString();
  S.undo=prevSlots?{pid:pid,slots:prevSlots,workers:clone(old.workers),holidays:clone(old.holidays)}:null;
  S.periods[pid]=p;S.roster.lastAvailable=d.avail.slice();S.clearPins=false;

async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}

function gateHTML(){
  var g=S.gate,err=S.gateErr?'<div class="err">'+esc(S.gateErr)+'</div>':'';

  function pw(id,l,ac){return '<div class="field"><label for="'+id+'">'+l+'</label><input type="password" id="'+id+'" autocomplete="'+ac+'"></div>'}
  if(g==='loading')return '<div class="empty-state"><h2>Loading…</h2></div>';
  if(g==='noadmin')return '<section class="step gate"><h2>Admin not available</h2><p class="note">The admin password has not been created yet. The page owner needs to open this page while signed in to claude.ai and create it.</p>'+back+'</section>';
  if(g==='setup')return '<section class="step gate"><h2>Create the admin password</h2><p class="note">Use at least 6 characters. It is stored only in this browser, so it keeps casual visitors out of the admin screen but is not strong security.</p>'+pw('pw1','New password','new-password')+pw('pw2','Repeat password','new-password')+err+'<button type="button" class="btn primary" data-act="setup-pw">Create password</button>'+back+'</section>';
  if(g==='change')return '<section class="step gate"><h2>Change password</h2>'+pw('pw0','Current password','current-password')+pw('pw1','New password','new-password')+pw('pw2','Repeat new password','new-password')+err+'<div class="row"><button type="button" class="btn primary" data-act="save-pw">Save</button><button type="button" class="btn" data-act="cancel-pw">Cancel</button></div></section>';
  return '<section class="step gate"><h2>Admin sign in</h2><p class="note">Enter the password to edit the rota.</p>'+pw('pw1','Password','current-password')+err+'<button type="button" class="btn primary" data-act="login">Sign in</button>'+back+'</section>';
}

function restoreFrom(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(d.kind!=='bench-rota-backup'||!d.periods)throw new Error('bad');
      if(d.roster&&d.roster.workers){S.roster={workers:d.roster.workers,lastAvailable:d.roster.lastAvailable||[]};saveRoster()}
      Object.keys(d.periods).forEach(function(id){var p=d.periods[id];if(p&&p.id){S.periods[p.id]=p;savePeriod(p)}});
      afterUnlock();render();toast('Backup restored.');
    }catch(e){toast('That file is not a Bench Rota backup.')}
  };
  r.readAsText(file);
}

    if(a.length<6){S.gateErr='Use at least 6 characters.';render();return}
    if(a!==b){S.gateErr='The two new passwords do not match.';render();return}

  else if(b==='restore-file'){if(el.files&&el.files[0])restoreFrom(el.files[0]);el.value=''}
  else if(b==='pin-toggle'){S.modal.pin=el.checked}
  else if(b==='w-short'){var dd=S.modal.draft;dd.onlyShort=el.checked;if(el.checked){dd.only12=false;dd.only16=false}S.modal.err=null;renderModal()}
  else if(b==='w-12'||b==='w-16'){var d2=S.modal.draft;d2[b==='w-12'?'only12':'only16']=el.checked;if(el.checked)d2.onlyShort=false;S.modal.err=null;renderModal()}
  else if(b==='w-day'){S.modal.draft.daytimeOnly=el.checked}
});
document.addEventListener('input',function(e){
  var el=e.target;if(!el.dataset)return;
  if(el.dataset.bind==='wname'){S.modal.draft.name=el.value;S.modal.err=null}
  else if(el.dataset.bind==='wmax'){S.modal.draft.maxHours=el.value;S.modal.err=null}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.modal)closeModal();
  if(e.key==='Enter'&&S.view==='admin'&&S.gate!=='open'&&e.target.id&&/^pw[0-2]$/.test(e.target.id)){e.preventDefault();var b=document.querySelector('.gate .btn.primary');if(b)b.click()}
  if(e.key==='Enter'&&S.modal&&S.modal.type==='worker'&&e.target.id==='wname'){e.preventDefault();ACT['save-worker']()}
});

/* ---------- start ---------- */
async function boot(){
  await loadSnap();S.pid=pickPubPid();render();
  var flag=false;try{flag=sessionStorage.getItem('benchrota:admin')==='1'}catch(e){}
  if(flag)enterAdmin();
}
boot();
})();
</script>
